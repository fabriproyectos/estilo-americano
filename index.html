:root{--bg:#0a0610;--card:#160e1e;--tx:#fff8ee;--mut:#bfaecb;--pri:#ffcc33;--ok:#3ddc84;--bad:#ff5c8a;--bd:#4d3a14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0a0610;color-scheme:dark}html,body{margin:0;min-height:100%}
body{background:var(--bg);min-height:100vh;color:var(--tx);font:18px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:600px;margin:auto}
#app{padding:14px 14px 110px}
h1{font-size:24px;margin:6px 0 12px;color:#ffcc33}h2{font-size:20px;margin:0 0 8px;color:#ffcc33}.logo{display:block;width:150px;height:auto;margin:4px auto 8px;border-radius:50%;box-shadow:0 0 22px #ff1fc855}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:15px}
.big{font-size:28px;font-weight:800}
.bad{color:var(--bad)}.ok{color:var(--ok)}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 16px;background:linear-gradient(90deg,#ff1fc8,#7b3cff,#19c6ff);color:#fff;width:100%;margin-top:8px}
button.sec{background:transparent;color:#ffcc33;border:2px solid #ffcc33}
button.del{background:transparent;color:var(--bad);border:2px solid var(--bad);padding:8px 12px;width:auto;margin:0;font-size:15px}
input,select{font:inherit;width:100%;padding:14px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0 10px}
label{font-weight:700;font-size:16px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{flex:1;text-align:center;padding:10px 2px;font-size:12px;font-weight:700;color:var(--mut)}
nav div.on{color:#ffcc33}nav div span{display:block;font-size:24px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:#ff1fc8;color:#fff;font-size:14px;font-weight:700}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:#000c;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:var(--bg);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:18px;max-height:90%;overflow:auto}
.back{background:none;color:#19c6ff;width:auto;padding:6px 0;margin:0 0 6px}

async function start(){
  $('app').innerHTML='<h1>Cargando…</h1>';

  if(r.error||!r.data){aviso('No se pudo cargar la base: '+(r.error?r.error.message:'falta ejecutar el SQL de instalación'));return}
  ver=r.data.version;var rem=snap(r.data.data),raw=null,lo=null;base=snap(rem);S=snap(rem);
  try{raw=localStorage.getItem('vivos_v1');lo=raw&&JSON.parse(raw)}catch(e){lo=null}

    if(await preguntaMig(cuenta(snap(lo)))){S=snap(lo);cur=cur||lo.vivoActual}}
  if(lo&&(cuenta(rem)||cuenta(S))){try{localStorage.setItem('vivos_v1_backup',raw);localStorage.removeItem('vivos_v1')}catch(e){}}
  S.vivoActual=vivo(cur)?cur:(S.vivos.length?S.vivos[S.vivos.length-1].id:null);

  var d=$('d').value.trim(),p=parseFloat($('p').value),g=parseFloat($('g').value)||0,o=origen();
  if(!d||!(p>=0))return aviso('Poné la prenda y el precio');
  var pid=uid();
  S.prendas.push(mk(o,{id:pid,cid:id,desc:d,precio:p}));
  if(g>0)S.pagos.push(mk(o,{id:uid(),pid:pid,cid:id,monto:g,nota:'con '+d}));
  save();closeM();render()
}
function formPago(id){
  if(modo=='vivo'&&needVivo())return;
  var t=totales(id);
  modal('<h2>Registrar pago</h2>'+dondeHtml()+'<div class="mut" style="margin-bottom:8px">Debe ahora: '+money(Math.max(t.debe,0))+'</div><label>Monto transferido</label><input id="g" type="number" inputmode="numeric" placeholder="3000"><label>Nota (opcional)</label><input id="nt" placeholder="Ej: transferencia"><button onclick="okPago(\''+id+'\')">Guardar</button><button class="sec" onclick="closeM()">Cancelar</button>')
}
function okPago(id){var g=parseFloat($('g').value);if(!(g>0))return aviso('Poné el monto');S.pagos.push(mk(origen(),{id:uid(),cid:id,monto:g,nota:$('nt').value.trim()}));save();closeM();render()}
function delPrenda(id){
  var x=S.prendas.filter(function(y){return y.id==id})[0];if(!x)return;
  var ligados=S.pagos.filter(function(p){return p.pid==id});
  var m='¿Cancelar la venta de "'+x.desc+'" ('+money(x.precio)+')?';
  if(ligados.length)m+='\n\nTambién se borra el pago de '+money(ligados.reduce(function(a,p){return a+p.monto},0))+' que se cargó junto con esta prenda.';
  ask(m,function(){S.prendas=S.prendas.filter(function(y){return y.id!=id});S.pagos=S.pagos.filter(function(p){return p.pid!=id});save();render()})
}
function delItem(k,id){ask('¿Borrar este pago?',function(){S[k]=S[k].filter(function(x){return x.id!=id});save();render()})}
function delPersona(id){var c=comp(id);ask('¿Borrar a '+c.nombre+' con todas sus compras y pagos? No se puede deshacer.',function(){S.compradoras=S.compradoras.filter(function(x){return x.id!=id});S.prendas=S.prendas.filter(function(x){return x.cid!=id});S.pagos=S.pagos.filter(function(x){return x.cid!=id});save();sel=null;render()})}
function borrarTodo(){ask('¿Borrar TODOS los datos de la app (clientas, ventas, pagos y vivos)? No se puede deshacer.',function(){S={compradoras:[],prendas:[],pagos:[],vivos:[],vivoActual:null};save();sel=null;tab='inicio';render()})}

function viewResumen(){
  var vid=resVivo=='todos'?null:resVivo;
  var h='<h1>📋 Resumen</h1><select onchange="resVivo=this.value;render()"><option value="todos">Todo (vivos + diarias)</option>'+S.vivos.slice().reverse().map(function(v){return '<option value="'+v.id+'"'+(v.id==resVivo?' selected':'')+'>'+vivoTxt(v.id)+'</option>'}).join('')+'</select>';
  var rows=[],T=0,P=0,D=0;
  S.compradoras.forEach(function(c){var t=totales(c.id,vid);if(t.pr.length||t.pg.length){rows.push({c:c,t:t});T+=t.total;P+=t.pago;D+=t.debe}});
  rows.sort(function(a,b){return b.t.debe-a.t.debe});
  h+='<div class="card"><div class="row"><span>Vendido</span><b>'+money(T)+'</b></div><div class="row"><span>Cobrado</span><b class="ok">'+money(P)+'</b></div><div class="row"><span>Me deben</span><b class="bad">'+money(D)+'</b></div></div>';
  h+=rows.length?rows.map(function(r){return '<div class="card" onclick="abrir(\''+r.c.id+'\')"><div class="row"><b>'+esc(r.c.nombre)+'</b><b class="'+(r.t.debe>0?'bad':'ok')+'">'+(r.t.debe>0?'debe '+money(r.t.debe):'Al día ✓')+'</b></div><div class="mut">'+r.t.pr.map(function(x){return esc(x.desc)}).join(', ')+'</div><div class="mut">Total '+money(r.t.total)+' · Pagó '+money(r.t.pago)+'</div></div>'}).join(''):'<div class="mut" style="text-align:center;padding:20px">Sin movimientos.</div>';
  if(rows.length)h+='<button onclick="copiar()">📤 Compartir / copiar resumen</button>';
  return h
}
function copiar(){
  var vid=resVivo=='todos'?null:resVivo,tx='RESUMEN '+(vid?vivoTxt(vid):'GENERAL')+'\n\n';
  S.compradoras.forEach(function(c){var t=totales(c.id,vid);if(t.pr.length||t.pg.length)tx+=c.nombre+' ('+(c.tel||'-')+')\n  '+t.pr.map(function(x){return x.desc+' '+money(x.precio)}).join(', ')+'\n  Total '+money(t.total)+' | Pagó '+money(t.pago)+' | Debe '+money(Math.max(t.debe,0))+'\n\n'});
  if(navigator.share){navigator.share({text:tx}).catch(function(){})}
  else{try{navigator.clipboard.writeText(tx);aviso('Resumen copiado')}catch(e){verTexto('Copiá el resumen:',tx)}}
}
function ov(h){var o=$('av');if(o)o.remove();o=document.createElement('div');o.className='modal';o.id='av';o.style.zIndex=20;o.style.alignItems='center';o.innerHTML='<div style="border-radius:22px;margin:16px">'+h+'</div>';document.body.appendChild(o)}
function closeA(){var o=$('av');if(o)o.remove()}
function aviso(m){ov('<div style="font-size:18px;white-space:pre-line">'+esc(m)+'</div><button onclick="closeA()">Entendido</button>')}
function ask(m,cb){window._cb=cb;ov('<div style="font-size:18px;white-space:pre-line">'+esc(m)+'</div><button class="del" style="width:100%;padding:14px;margin-top:14px;font-size:17px" onclick="var f=window._cb;closeA();f()">🗑 Sí, borrar</button><button class="sec" onclick="closeA()">No, volver</button>')}
function verTexto(m,tx){ov('<div style="font-size:17px;margin-bottom:8px">'+esc(m)+'</div><textarea readonly rows="7" onclick="this.select()" style="width:100%;font:13px monospace;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx)">'+esc(tx)+'</textarea><button onclick="closeA()">Listo</button>')}
function modal(h){closeM();var m=document.createElement('div');m.className='modal';m.id='m';m.innerHTML='<div>'+h+'</div>';document.body.appendChild(m);var i=m.querySelector('input');if(i)setTimeout(function(){i.focus()},100)}
function closeM(){var m=$('m');if(m)m.remove()}
boot();
</script></body></html>
